spring:
  application:
    name: ticketBooking
  datasource:
    url: jdbc:mysql://localhost:3306/DATABASE_NAME #database connection url with the database name
    username: USERNAME
    password: PASSWORD
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update   #automatically updates the schema of the database, there are other options as well, second option is create: creates the new schema everytime the connection is made, the previous schema is dropped with teh data, 3rd option is the create-drop, whihc create the new schema and drops it at rhe shutdown.
    show-sql: true #shows thw query which is executing for the purpose of the debugging
