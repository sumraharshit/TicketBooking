spring:
  application:
    name: ticketBooking
  datasource:
    url: jdbc:mysql://localhost:3306/ticketBooking  #database connection url with the database name
    username: root
    password: DawnHorizon0@mysql
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update   #automatically updates the schema of the database, there are other options as well, second option is create: creates the new schema everytime the connection is made, the previous schema is dropped with teh data, 3rd option is the create-drop, whihc create the new schema and drops it at rhe shutdown.
    show-sql: true #shows thw query which is executing for the purpose of the debugging
  redis:
    host: localhost
    port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id:
      - notification-booking
      - pdf-booking
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.json.trusted.packages: '*'
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer

#We are using the ErrorHandlingSerializer clas to avoid the poison pill situation where the a corrupted
#object gets pushed to the topi, and upon consumption by the consumer it cannot be deserialized and throws the
#excception. When the consumer retries it gives the same result, entering a deadlock situation. This
#ErrorHandling deserializer is handling those errors for us.

